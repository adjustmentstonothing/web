    <style>
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        background: #000;
        overflow: hidden;
        overscroll-behavior: none;
        -webkit-tap-highlight-color: transparent;
        touch-action: none;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #app {
        position: relative;
        /* width: min(100vmin, 800px); */
        height: 90vh;
        background: #000;
        flex-shrink: 0;
        transform-origin: center center;
      }
      #app.scene-loading {
        opacity: 0;
        pointer-events: none;
      }
      #app.scene-ready {
        opacity: 1;
        transition: opacity 0.4s ease;
      }
      #scene-loader {
        display: none;
        position: fixed;
        left: 50%;
        bottom: max(28px, env(safe-area-inset-bottom));
        transform: translateX(-50%);
        z-index: 4;
        width: min(120px, 40vw);
        height: 1px;
        background: rgba(255, 255, 255, 0.12);
        pointer-events: none;
        opacity: 1;
        transition: opacity 0.35s ease;
      }
      #scene-loader.is-done {
        opacity: 0;
      }
      #scene-loader-bar {
        display: block;
        height: 100%;
        width: 100%;
        background: rgba(255, 255, 255, 0.45);
        transform: scaleX(0);
        transform-origin: left center;
        transition: transform 0.15s ease-out;
      }
      @media (min-width: 768px) {
        #app {
          transform: scale(0.9);
        }
      }
      canvas { display: block; }
    </style>
  </head>
  <body class="home">
    <div id="scene-loader" aria-hidden="true">
      <span id="scene-loader-bar"></span>
    </div>
    <div id="scene-root" class="scene-root">

    </div>
    <div id="home-content" class="home-shell">

        <ul class="subfooter-nav" aria-label="Site">
