<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="color-scheme" content="dark" />
  <meta name="robots" content="noindex" />
  <title>Get the App — Adjustments to Nothing</title>
  <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="shortcut icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <style>
    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #000;
      color: #fff;
      font: 400 22px/1.55 "GT Standard", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      -webkit-user-select: none;
      user-select: none;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 1.5rem;
      box-sizing: border-box;
    }

    .get-fallback {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
      text-align: center;
    }

    .get-title {
      margin: 0;
      font-size: 48px;
      line-height: 1.22;
      font-weight: 400;
    }

    @media (max-width: 600px) {
      .get-title {
        font-size: 40px;
        line-height: 40px;
      }
    }

    .get-links {
      display: flex;
      gap: 1.5rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .get-links a {
      color: #fff;
      text-decoration: underline;
      text-underline-offset: 0.2em;
    }

    .get-links[hidden] {
      display: none;
    }
  </style>
</head>

<body>
  <div class="get-fallback">
    <p class="get-title">Get the App</p>
    <nav class="get-links" id="get-links" aria-label="Store links">
      <a
        href="https://apps.apple.com/ch/app/adjustments-to-nothing/id6790154820?l=en-GB"
        rel="noopener noreferrer"
        >App Store</a>
      <a
        href="https://play.google.com/store/apps/details?id=com.adjustmentstonothing.app"
        rel="noopener noreferrer"
        >Google Play</a>
    </nav>
  </div>
  <script type="module">
    import {
      APP_STORE_URL,
      PLAY_STORE_URL,
      detectPlatform,
    } from "/src/store-detect.js";

    const platform = detectPlatform();
    if (platform === "ios") {
      location.replace(APP_STORE_URL);
    } else if (platform === "android") {
      location.replace(PLAY_STORE_URL);
    }
    // else: keep both links visible for unknown / no-JS fallback
  </script>
</body>

</html>
